name: Homework 06 - BankAccount Tests

on:
  push:
    branches:
      - mikloshetzer-sketch-hw-06-testing
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run BankAccount tests
        working-directory: homeworks/hetzermiklos/hw_06_testing
        run: python -m pytest test_bank_account.py -v
